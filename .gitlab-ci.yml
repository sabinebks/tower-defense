image: ubuntu:latest

stages:
  - build
  - test
  - package
  - docs

before_script:
  - apt-get update
  - apt-get install -y make openjdk-17-jdk locales
  - locale-gen fr_FR.UTF-8
  - export LANG=fr_FR.UTF-8

classes:
  stage: build
  script:
    - make classes
  artifacts:
    paths:
      - classes/

tests:
  stage: build
  script:
    - make tests
  artifacts:
    paths:
      - tests/

runtests:
  stage: test
  script:
    - make runtests

jar:
  stage: package
  script:
    - make jar
    - test -n "$(ls Livrable*A.jar 2>/dev/null)" || exit 1
    - test -n "$(ls Livrable*B.jar 2>/dev/null)" || exit 1

  artifacts:
    paths:
      - Livrable*A.jar
      - Livrable*B.jar

docs:
  stage: docs
  script:
    - make docs

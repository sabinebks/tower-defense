image: ubuntu:latest

stages:
  - build
  - test
  - package
  - docs

before_script:
  - apt-get update
  - apt-get install -y make openjdk-17-jdk locales
  - locale-gen fr_FR.UTF-8
  - export LANG=fr_FR.UTF-8

classes:
  stage: build
  script:
    - make classes
  artifacts:
    paths:
      - classes/

tests:
  stage: build
  script:
    - make tests
  artifacts:
    paths:
      - tests/

runtests:
  stage: test
  script:
    - make runtests

jar:
  stage: package
  script:
    - make jar
    - JARA=$(find . -iname "Livrable*A.jar" | sort -r | head -n 1)
    - test -n "$JARA" || { echo "Jar introuvable"; exit 1; }
    - JARB=$(find . -iname "Livrable*B.jar" | sort -r | head -n 1)
    - test -n "$JARB" || { echo "Jar introuvable"; exit 1; }
    - mkdir -p CI_artefacts/ && cp $JARA CI_artefacts/livrableA.jar && cp $JARB CI_artefacts/livrableB.jar

  artifacts:
    paths:
      - CI_artefacts/livrableA
      - CI_artefacts/livrableB


docs:
  stage: docs
  script:
    - make docs
